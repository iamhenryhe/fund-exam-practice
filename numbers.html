<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基金考试数字题</title>
<style>
body{font:17px/1.65 system-ui,sans-serif;max-width:820px;margin:auto;padding:20px;background:#f5f7fb;color:#172539}button,select{font:inherit;padding:6px 12px}article{background:white;border:1px solid #dbe1ea;border-radius:10px;padding:14px;margin:10px 0;white-space:pre-wrap}article p{margin:0 0 6px}strong{color:#166534}a{color:#184da9}
</style>
<style>
details{margin:12px 0;border:1px solid #dbe1ea;border-radius:10px;background:#fff;padding:10px 14px}
summary{cursor:pointer;font-weight:700;padding:4px 0}
</style>
<a href="./">← 返回首页</a>
<h1>数字题</h1>
<label>科目 <select id="subject"><option value="fund1">科目一</option><option value="fund2">科目二</option></select></label>
<p id="message" role="status"></p>
<button id="export" type="button">下载两科清单（TXT）</button>
<main id="cards"></main>
<script>
const el=id=>document.getElementById(id);
const banks=new Map();
const compact=s=>s.normalize('NFKC').replace(/\s+/g,'');
const unit=/(?:%|‰|个百分点|基点|个?工作日|交易日|自然日|天|个月|年|小时|分钟|亿元|万元|元|万份|份|个|次|倍|人|家|笔)/;
function numeric(s){
 const v=compact(s);
 const simple=/^(?:(?:至少|最多|不少于|不超过|低于|高于|约|满|超过|不低于|人民币|每年)*[-+−]?[0-9０-９零〇一二两三四五六七八九十百千万亿]+(?:[.,／/][0-9]+)*(?:%|‰|[个工作交易自然日天月年小时分钟亿万元份次倍人家笔点基税率年内以上以下左右整]*)[、，,；;至到~～—-]?)+[。.]?$/;
 return simple.test(v)||new RegExp('[0-9]'+unit.source).test(v);
}
function collect(bank){
 const seen=new Set(), result=[];
 for(const q of bank){
  const answers=q.answer.map(i=>q.options[i]);
  if(!answers.length||answers.some(a=>typeof a!=='string'))continue;
  if(!answers.some(numeric))continue;
  const id=JSON.stringify([compact(q.prompt),answers.map(compact).sort()]);
  if(seen.has(id))continue;
  seen.add(id);result.push({prompt:q.prompt,answers});
 }
 return result;
}
let version=0;
const numberPattern=/(?<![\d.])[+−-]?\d+(?:,\d{3})*(?:\.\d+)?|[零〇一二两三四五六七八九十百千万亿]+(?=(?:个?(?:工作日|交易日|自然日|月|季度)|年|日|天|小时|分钟|人|家|次|倍|元|份|笔|%|‰|$))/g;
function chinese(s){
 const digits='零一二三四五六七八九', units={十:10,百:100,千:1000};
 let total=0,part=0,d=0;
 for(const c of s.replace(/两/g,'二').replace(/〇/g,'零')){
  if(digits.includes(c))d=digits.indexOf(c);
  else if(units[c]){part+=(d||1)*units[c];d=0;}
  else{total=c==='亿'?(total+part+d)*1e8:total+(part+d)*1e4;part=0;d=0;}
 }
 return total+part+d;
}
function values(item){
 return [...new Set((compact(item.answers.join('；')).match(numberPattern)||[]).map(x=>/^\d|^[+−-]/.test(x)?Number(x.replace(/,/g,'').replace('−','-')):chinese(x)))];
}
function parts(item){
 const prompt=item.prompt;
 const blank=/[（(][\s\u3000＿_]*[）)]|[_＿]{2,}/g;
 const count=[...prompt.matchAll(blank)].length;
 const a=item.answers.length===1&&count>1?item.answers[0].split(/\s*[；;、，,]\s*(?!\d{3}(?:\D|$))/):item.answers;
 if(count&&count===a.length){
  const chunks=prompt.split(blank);
  return chunks.flatMap((t,i)=>i<a.length?[[t,false],[a[i],true]]:[[t,false]]);
 }
 return [[prompt,false],['\n题库答案：',false],[item.answers.join('；'),true]];
}
function groupsFor(items){
 const buckets=new Map();
 for(const item of items){
  const nums=values(item);
  for(const n of nums.length?nums:[Infinity]){
   if(!buckets.has(n))buckets.set(n,[]);
   buckets.get(n).push(item);
  }
 }
 return [...buckets].sort(([a],[b])=>a-b);
}
const groupTitle=n=>Number.isFinite(n)?String(n):'其他数字表述';
const line=item=>parts(item).map(([t])=>t).join('');
function render(items){
 const batch=document.createDocumentFragment();
 for(const [n,list] of groupsFor(items)){
  const section=document.createElement('details'),title=document.createElement('summary');
  title.textContent=groupTitle(n)+' · '+list.length+' 道';
  section.append(title);
  for(const item of list){
   const card=document.createElement('article');
   for(const [t,green] of parts(item)){
    if(!green)card.append(document.createTextNode(t));
    else{const b=document.createElement('strong');b.textContent=t;card.append(b);}
   }
   section.append(card);
  }
  batch.append(section);
 }
 el('cards').replaceChildren(batch);
 el('message').textContent='共 '+items.length+' 道原题 · 多个答案数字的题会出现在多个组，单位保持不变';
}
async function getBank(id){
 if(!banks.has(id)){
  const response=await fetch('./data/'+id+'.json');
  if(!response.ok)throw Error('HTTP '+response.status);
  banks.set(id,collect(await response.json()));
 }
 return banks.get(id);
}
el('export').onclick=async()=>{
 try{
  const all=await Promise.all(['fund1','fund2'].map(getBank));
  const lines=['基金考试数字题｜历史题库摘录，规则以考试教材为准','整理要求：按数字合并记忆，保留单位与适用条件；不要把历史题库答案视作现行规则。'];
  all.forEach((items,i)=>{
   lines.push('\n# 科目'+(i+1));
   for(const [n,list] of groupsFor(items))lines.push('\n## '+groupTitle(n),...list.map(item=>'- '+line(item)));
  });
  const url=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}));
  const link=document.createElement('a');link.href=url;link.download='基金考试数字题-两科清单.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 }catch{el('message').textContent='清单生成失败，请重试。';}
};
async function load(){
 const id=el('subject').value, seq=++version;
 el('cards').replaceChildren();el('message').textContent='正在筛选题库…';
 try{
  const items=await getBank(id);
  if(seq!==version)return;
  render(items);
 }catch(e){if(seq===version)el('message').textContent='无法加载题库，请刷新重试。';}
}
el('subject').addEventListener('change',load);load();
</script>
</html>
