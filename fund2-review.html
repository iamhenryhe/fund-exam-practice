<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科目二剩余考点</title>
<style>
body{font:17px/1.6 system-ui,sans-serif;max-width:850px;margin:auto;padding:20px;color:#172539;background:#f5f7fb}
section,details{background:white;border:1px solid #dbe1ea;border-radius:10px;padding:12px;margin:10px 0}
button,select{font:inherit;padding:8px 12px;cursor:pointer} summary{cursor:pointer;font-weight:650} .option{display:block;margin:8px 0;width:100%;text-align:left} #feedback{white-space:pre-wrap} button:disabled{cursor:default;color:#172539} button.correct{background:#c9f0d7} button.wrong{background:#ffdedd} a{color:#184da9}
</style>
<style>
button.topic-complete{background:#dcfce7;border:1px solid #449761;border-radius:6px;color:#14532d}
details.section-complete{border-color:#8bc99e}
details.section-complete>summary{color:#166534}
</style>
<a href="./">← 返回基金刷题首页</a>
<h1>科目二剩余考点</h1>
<p id="status">正在加载题库…</p>
<button id="review-toggle" type="button" hidden>考前速记 · 按章看知识点</button>
<div id="review-notes" hidden></div>
<main id="groups"></main>
<section id="quiz" hidden></section>
<script>
const byId=id=>document.getElementById(id);
const groups=byId('groups'),quiz=byId('quiz'),status=byId('status');
const key='fundlab-fund2-review-v1';
let saved={};
try{saved=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{}
const norm=s=>s.normalize('NFKC').replace(/\s+/g,'');
const signature=q=>JSON.stringify([q.type,norm(q.prompt),q.options.map(norm).sort(),q.answer.map(i=>norm(q.options[i])).sort()]);
const pending=i=>(i>=500&&i<1000)||i>=1300;
const chapters={
  6:[
    ['3-4 货币时间价值与利率',/利率|货币的时间价值|单利|PV和FV/,/即期利率|名义利率|单利|PV和FV/],
    ['3-5 常用描述性统计概念',/分位数|相关性|标准差/],
    ['3-1 三大财务报表',/利润和现金流/],
    ['3-2 财务报表分析',/./]],
  8:[['5-7 货币市场工具',/货币市场/],['5-2 债券估值分析',/估值/],['5-3 债券的收益率',/收益率/],['5-1 债券与债券市场',/风险/]],
  9:[['6-5 基本衍生工具的比较',/远期、期货、期权/],['6-3 期权合约',/期权/],['6-4 互换合约',/互换/],['6-2 远期合约和期货合约',/远期|期货/],['6-1 衍生工具概述',/./]],
  15:[['12-4 风险调整后收益',/风险调整/],['12-2 绝对收益与相对收益',/绝对|相对/]],
  17:[['14-6 银行间债券市场的结算',/银行间债券结算/],['14-5 银行间债券市场的交易',/银行间债券市场/],['14-4 场内证券交易特别规定及事项',/特别规定/],['14-3 场内证券交易与结算涉及的费用',/费用/],['14-1 场内证券交易所与结算机构',/结算机构/],['14-2 场内证券交易的结算原则、方式与内容',/结算|PROP/]],
  18:[['15-3 基金费用',/费用|管理费/],['15-5 基金会计核算的特点',/会计|财务|收入/],['15-2 基金资产估值程序',/程序|投资品种/],['15-1 基金资产估值概述',/估值/]],
  19:[['16-1 基金利润分配',/利润|分红|分拆/],['16-2 投资者买卖基金产生的税收',/投资者/]]
};
function classify(q){
 const ch=Number(q.chapter.match(/\d+/)?.[0]), t=q.topic, p=q.prompt;
 if(/质押式回购|买断式回购/.test(p)){
   const sub=/质押式回购/.test(p)?(/买断式回购/.test(p)?'质押式与买断式回购对比':'质押式回购'):'买断式回购';
   return [ch===17 && /场内/.test(t)?'14-4 场内证券交易特别规定及事项':'14-6 银行间债券市场的结算',sub];
 }
 if(ch===18 && /暂停估值|估值错误|计价错误/.test(p))return ['15-4 计价错误的处理与责任承担、暂停估值情形',/暂停估值/.test(p)?'暂停估值':'估值或计价错误'];
 const section=chapters[ch]?.find(([,re])=>re.test(t));
 return [section?.[0]||'讲义未覆盖或待核对',t];
}
function element(tag,label,parent){const e=document.createElement(tag);e.textContent=label;parent.append(e);return e;}
function button(label,parent,fn){const b=element('button',label,parent);b.onclick=fn;return b;}
function report(list,start){
 const q=list[start];
 quiz.replaceChildren();groups.hidden=true;quiz.hidden=false;toggle.hidden=true;
 button('← 返回考点',quiz,()=>{quiz.hidden=true;groups.hidden=false;toggle.hidden=false;render();});
 element('p','组内 '+(start+1)+' / '+list.length+' · 原题第 '+q.number+' 题',quiz);
 element('h2',q.prompt,quiz);
 const multi=q.answer.length>1, selected=new Set(saved[q.id]||[]), locked=Object.hasOwn(saved,q.id);
 const options=q.options.map((o,i)=>{
  const b=button(String.fromCharCode(65+i)+'．'+o,quiz,()=>{
   if(!multi){selected.clear();selected.add(i);submit();}
   else{if(selected.has(i))selected.delete(i);else selected.add(i);b.setAttribute('aria-pressed',String(selected.has(i)));b.style.outline=selected.has(i)?'2px solid #184da9':'';}
  });b.className='option';return b;
 });
 const confirm=multi?button('提交答案',quiz,()=>{if(selected.size)submit()}):null;
 const fb=element('p','',quiz);fb.id='feedback';fb.setAttribute('aria-live','polite');
 function reveal(){
  options.forEach((b,i)=>{b.disabled=true;if(q.answer.includes(i))b.classList.add('correct');else if(selected.has(i))b.classList.add('wrong');});
  if(confirm)confirm.disabled=true;
  const correct=selected.size===q.answer.length&&q.answer.every(i=>selected.has(i));
  fb.textContent=(correct?'答对了':'答错了')+' · 正确答案：'+q.answer.map(i=>String.fromCharCode(65+i)).join('、')+'\n'+(q.explanation||'原题未附解析。');
 }
 function submit(){saved[q.id]=[...selected];try{localStorage.setItem(key,JSON.stringify(saved))}catch{}reveal();}
 if(locked)reveal();
 button('上一题',quiz,()=>report(list,start-1)).disabled=start===0;
 button('下一题',quiz,()=>report(list,start+1)).disabled=start===list.length-1;
 window.scrollTo(0,0);
}
const catalog=new Map();
const notes=byId('review-notes'), toggle=byId('review-toggle');
const chapterNames={3:'投资管理基础',5:'固定收益投资',6:'衍生工具',12:'基金业绩评价',14:'投资交易与结算',15:'估值、费用与会计核算',16:'利润分配与税收'};
const study={
 3:[
 ['利润：已实现不等于账面总利润','期末已实现未分配利润＝期初已实现未分配利润＋本期已实现收益（题目若给分红、份额交易等调整，再按题意计入）。第880题：期初已实现20万，投资亏1万，利息收入0.5万，得19.5万。期初总未分配利润10万不是起点，公允价值变动亏2.5万不计入已实现部分。'],
 ['三张报表','资产负债表看某一时点：资产＝负债＋所有者权益。利润表看一段期间的盈利；现金流量表看经营、投资、筹资现金的实际流入流出。赚了钱不等于收到现金。'],
 ['杜邦分析（第946题）','拆的是净资产收益率 ROE，不是总资产收益率 ROA。ROE＝销售净利率×总资产周转率×权益乘数；按同一净利润口径，前两项相乘是 ROA。权益乘数＝总资产÷净资产，反映杠杆。看到“杜邦逐级拆 ROA”，选错。'],
 ['常用比率','流动比率＝流动资产÷流动负债；速动比率常用（流动资产－存货）÷流动负债。资产负债率＝总负债÷总资产；总资产周转率＝营业收入÷平均总资产。ROA 的利润口径按题意。'],
 ['货币时间价值','单利终值＝本金×(1＋利率×期数)；复利终值＝本金×(1＋利率)^期数；现值把复利因子除回去。年名义利率 r、每年计息 m 次，实际年利率＝(1＋r/m)^m－1；若题目说通胀，实际收益率＝(1＋名义收益率)/(1＋通胀率)－1。远期利率用两个不同期限的复利因子相除求出。'],
 ['统计','标准差是方差开平方；方差的单位是原单位的平方。中位数先排序，偶数样本取中间两个平均。相关系数在－1到1之间，0只表示无线性相关，不能推出独立。']],
 5:[
 ['债券价格和收益率反向','债券价格＝未来票息与本金分别折现后相加；零息债只折现到期本金。到期收益率高于票面利率时，普通固定息债低于面值；相等则平价。'],
 ['两种收益率','当期收益率＝年票息÷当前价格，不算本金价差；到期收益率是让全部未来现金流的现值等于市价的折现率。'],
 ['风险与货币市场工具','利率上升债价下降；久期越长通常越敏感。信用风险看违约和信用利差，再投资风险看收到票息后能否按原利率再投资。货币市场工具通常期限短，常见有短期国债、商业票据和大额可转让存单。']],
 6:[
 ['衍生工具四类','远期和期货是约定未来交易，双方有履约义务；期权买方有权无义务，卖方收权利金并承担履约义务；互换是按约定交换现金流。'],
 ['远期 vs 期货','远期多为场外、条款可定制，主要看对手方风险；期货标准化、交易所交易、保证金、逐日盯市。多头怕跌、空头怕涨。'],
 ['期权与套保','看涨期权到期内在价值＝max(标的价格－行权价,0)，看跌反过来；净利润再扣权利金。美式可在到期前行权，欧式只能到期日行权。标的波动率上升通常同时提高看涨和看跌期权价值。'],
 ['互换','单一币种利率互换常见固定换浮动，名义本金一般不交换；货币互换涉及不同币种，通常交换本金及利息。']],
 12:[
 ['收益率怎么算','持有期收益率＝(期末价值－期初价值＋期间分配)/期初价值。累计收益要连乘各期(1＋收益率)，不是直接相加。时间加权收益率剔除外部现金流的影响，适合评经理；资金加权收益率受申赎时点和金额影响。'],
 ['绝对收益 vs 相对收益','绝对收益看赚多少；相对收益看跑赢基准多少。基金涨5%、基准涨8%，绝对赚5%，相对落后3个百分点。'],
 ['风险调整指标','夏普：超额收益÷标准差（总风险）；特雷诺：超额收益÷β（系统风险）；詹森α：实际收益－CAPM预期收益；信息比率：相对基准超额收益÷跟踪误差。']],
 14:[
 ['质押式 vs 买断式回购','正回购方是借钱方，逆回购方是出钱方。质押式：只设质押，债券所有权不转移；买断式：首期债券卖给逆回购方，约定到期买回。判断题抓“所有权是否转移”，不要只看最后有没有回购。'],
 ['交易与结算分开','交易是成交，清算是算出应收应付，交收是真正交券付钱。券款对付 DVP＝交券与付款互为条件，减少一方付了却收不到的本金风险。净额结算是把应收应付抵销后交净额，不等于逐笔交收。'],
 ['机构与费用','交易所组织场内交易；中国结算承担证券登记、存管与结算等职能。交易佣金、经手费、过户费、印花税不是同一种费用，遇具体费率或适用市场按教材考试口径。']],
 15:[
 ['估值与净值','基金资产净值＝资产总值－负债；份额净值＝资产净值÷份额总数。先算资产负债，再除份额；不要把基金总规模当单份净值。'],
 ['估值、复核和暂停','管理人负责估值，托管人复核。活跃市场通常优先用可观察报价；报价不能代表公允价值时才需调整或用估值技术。暂停估值是无法可靠估值等特定情形，不是净值跌了就暂停。'],
 ['费用怎么记','管理费、托管费及适用的销售服务费通常按合同约定费率逐日计提；常见计算为前一日基金资产净值×年费率÷当年天数。认购、申购、赎回费与基金日常运作费区分；不同份额类别收费可不同。'],
 ['会计核算','基金以单只基金为会计核算主体，独立建账。投资收益与公允价值变动损益要分清；当期账面亏损不一定就是已实现亏损。']],
 16:[
 ['基金利润与可分配利润','基金利润看总收入扣费用；已实现收益与公允价值变动不同。期末可供分配利润，按期末未分配利润与其中已实现部分的孰低数掌握，不能把账面浮盈全当可分配利润。'],
 ['分红和份额变化','现金分红是拿现金；红利再投资是用红利换份额。分红不是凭空多赚，除息后净值会相应下降。份额拆分会增份额、降单份净值，不直接改变持有人总价值。'],
 ['税题先认纳税主体','分清基金自身投资、个人投资者与机构投资者三类主体，再看股息、利息、转让差价还是基金分红。历史题的具体税率和免税范围不要脱离题目口径硬背。']],
 其他:[
 ['跨境通道先看资金方向','QDII：境内资金投境外；QFII、RQFII：合格境外投资者进入境内市场，RQFII 名称强调人民币。沪港通、深港通和债券通是市场互联互通机制，不要和合格投资者资格混为一谈。']]
};
function showNotes(){
 element('p','先背公式、判断规则和易混对比。不用看原题。这是速记精编，未逐条覆盖剩余题库。',notes);
 for(const [id,items] of Object.entries(study)){
  const chapter=element('details','',notes);
  element('summary',chapterNames[id]?'第'+id+'章 '+chapterNames[id]:'补充：跨境投资',chapter);
  for(const [title,body] of items){
   const card=element('section','',chapter);
   element('strong',title,card);
   element('p',body,card);
  }
 }
}

toggle.onclick=()=>{
 const opening=notes.hidden;
 if(opening&&!notes.childElementCount)showNotes();
 notes.hidden=!opening;groups.hidden=opening;
 toggle.textContent=opening?'返回按小节刷题':'考前速记 · 按章看知识点';
};
let count=0;
function render(){
 groups.replaceChildren();
 status.textContent='原题 501–1000、1301–1419 · 去重后 '+count+' 道 · 独立记录进度';
 for(const [section,topics] of [...catalog].sort(([a],[b])=>a.localeCompare(b,'zh',{numeric:true}))){
  const list=[...topics.values()].flat().sort((a,b)=>a.number-b.number);
  const answered=list.filter(q=>Object.hasOwn(saved,q.id)).length;
  const complete=answered===list.length;
  const title=section==='6-1 衍生工具概述'?'6-1 衍生工具：分类与特点':section;
  const card=element('section','',groups);
  const sectionButton=button(title+'（'+answered+'/'+list.length+'）'+(complete?' ✓ 已刷完':''),card,()=>{
   report(list,Math.max(0,list.findIndex(q=>!Object.hasOwn(saved,q.id))));
  });
  if(complete)sectionButton.className='topic-complete';
 }
}
fetch('./data/fund2.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(bank=>{
 if(bank.length!==1419)throw Error('题库版本不匹配');
 const seen=new Set(bank.filter((_,i)=>!pending(i)).map(signature));
 bank.forEach((q,i)=>{
  if(!pending(i))return;
  const sig=signature(q);if(seen.has(sig))return;seen.add(sig);count++;
  const [section,topic]=classify(q);
  if(!catalog.has(section))catalog.set(section,new Map());
  const topics=catalog.get(section);
  if(!topics.has(topic))topics.set(topic,[]);
  topics.get(topic).push({...q,number:i+1});
 });
 render();
 toggle.hidden=false;
}).catch(e=>{status.textContent='题库没有加载成功：'+e.message;});
</script>
</html>
